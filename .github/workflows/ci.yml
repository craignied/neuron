name: CI

on: [push, pull_request]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A hung build should fail in minutes, not hang for twenty and then be
    # SIGTERMed with no useful log. On 2026-08-01 the macOS job wedged at ~90%
    # of the build, sat silent for 19.5 minutes, and every in-flight compile was
    # killed at once (exit 143) -- a resource stall, not a compile error.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install GSL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev

      - name: Install GSL (macOS)
        if: runner.os == 'macOS'
        run: brew install gsl

      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-gsl-${{ runner.os }}-x64

      - name: Install GSL (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install gsl:x64-windows

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        # BOUNDED parallelism. `--parallel` with no argument runs one job per
        # core, and each of the seventeen test targets compiles its own copy of
        # the engine sources -- 149 compilation units of src/ across the
        # project, for 67 files. On the hosted macOS runner that many concurrent
        # clang processes stalled the machine (see timeout-minutes above). The
        # real fix is to compile the engine once into layered static libraries
        # (refactor_audit.md D8); this bounds the damage until then.
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests (binormal ROC vs signal detection theory)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Golden transcript test
        shell: bash
        run: ./tests/golden/run_golden.sh

      - name: Python tools test (stdlib-only, system python3)
        shell: bash
        run: ./tests/tools/run_tools.sh

      - name: GUI endpoint smoke test
        shell: bash
        run: ./tests/gui/smoke.sh
